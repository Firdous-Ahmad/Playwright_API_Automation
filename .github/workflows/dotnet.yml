
name: Playwright API Automation CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Allure CLI
        run: |
          curl -fL https://github.com/allure-framework/allure2/releases/download/2.41.0/allure-2.41.0.zip -o allure.zip
          unzip -q allure.zip
          echo "$GITHUB_WORKSPACE/allure-2.41.0/bin" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore Playwright_API_Automation.slnx

      - name: Build solution
        run: dotnet build Playwright_API_Automation.slnx --configuration Release --no-restore

      - name: Run API tests
        run: dotnet test Playwright_API_Automation.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "Playwright_API_Automation/allure-results" ] && [ "$(find Playwright_API_Automation/allure-results -type f | wc -l)" -gt 0 ]; then
            allure generate Playwright_API_Automation/allure-results --clean -o allure-report
          else
            echo "No Allure results found. Skipping report generation."
          fi
          
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-HTML-Report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: API-Test-Results
          path: Playwright_API_Automation/TestResults/*.trx
          if-no-files-found: warn
